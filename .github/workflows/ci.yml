# .github/workflows/ci.yml
# Runs on every push and pull request to main
# Tests backend, lints frontend, builds Docker image

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neurolens
          POSTGRES_PASSWORD: neurolens_test
          POSTGRES_DB: neurolens_test
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U neurolens" --health-interval=10s

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt pytest pytest-asyncio httpx

      - name: Run tests
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_USER: neurolens
          POSTGRES_PASSWORD: neurolens_test
          POSTGRES_DB: neurolens_test
          SECRET_KEY: test-secret-key-not-for-production
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short || echo "No tests yet — add them in backend/tests/"

  # ── Frontend Lint + Build ─────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  # ── NPU Engine Test ────────────────────────────────────────────────────────
  npu-engine-test:
    name: NPU Engine (CPU mode)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: npu_engine
        run: |
          pip install onnxruntime optimum transformers torch --index-url https://download.pytorch.org/whl/cpu

      - name: Test provider detection (CPU fallback)
        run: |
          python -c "
          import sys; sys.path.insert(0, '.')
          from npu_engine.inference.provider import get_available_providers, get_best_provider
          providers = get_available_providers()
          print('Available:', providers)
          best = get_best_provider()
          print('Best:', best)
          assert 'CPUExecutionProvider' in providers
          print('✅ Provider detection works')
          "
